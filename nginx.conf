server {
  listen 80;
  root /usr/share/nginx/html;
  error_page 404 /+not-found.html;

  # Dynamic route: the static export has one page for every product id.
  location /product/ {
    try_files $uri $uri.html "/product/[id].html";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
